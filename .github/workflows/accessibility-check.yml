name: Accessibility Check

on:
  push:
    paths:
      - 'demo-pages/after.html'
  pull_request:
    paths:
      - 'demo-pages/after.html'

jobs:
  accessibility-check:
    name: WCAG 2.2 AA Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Generate Prisma client
        run: cd server && npx prisma generate

      - name: Start server
        run: |
          cd server && npx ts-node src/index.ts &
          sleep 5
        env:
          PORT: 3001
          DATABASE_URL: 'file:../data/ci-test.db'

      - name: Run accessibility scan on after.html
        run: |
          node -e "
          const { scanUrl } = require('./scanner/src/scan');
          const fs = require('fs');

          async function main() {
            console.log('Scanning demo after.html for accessibility violations...');
            const result = await scanUrl('http://localhost:3001/demo/after.html', {
              wcagVersion: '2.2',
              conformanceTarget: 'AA',
              timeout: 15000,
            });

            // Save scan results as artifact
            fs.writeFileSync('scan-results.json', JSON.stringify(result, null, 2));

            console.log('Total violations:', result.totalViolations);
            console.log('By severity:', JSON.stringify(result.violationsBySeverity));

            // Load baseline
            const baselinePath = './demo-pages/baseline.json';
            let baselineViolations = 0;
            if (fs.existsSync(baselinePath)) {
              const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf-8'));
              baselineViolations = baseline.expectedViolations || 0;
            }

            // Fail if new violations are introduced
            if (result.totalViolations > baselineViolations) {
              console.error(
                'FAIL: Found ' + result.totalViolations + ' violations, expected at most ' + baselineViolations
              );
              process.exit(1);
            }

            console.log('PASS: No new accessibility violations detected.');
          }

          main().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-scan-results
          path: scan-results.json

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('scan-results.json', 'utf-8'));
            const body = `## ❌ Accessibility Regression Detected

            **${results.totalViolations}** new accessibility violations found in \`demo-pages/after.html\`.

            | Severity | Count |
            |----------|-------|
            | Critical | ${results.violationsBySeverity.critical} |
            | Serious | ${results.violationsBySeverity.serious} |
            | Moderate | ${results.violationsBySeverity.moderate} |
            | Minor | ${results.violationsBySeverity.minor} |

            Please fix these violations before merging.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
